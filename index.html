<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora simples de Índice de Massa Corporal (IMC).">
    <title>Calculadora de IMC</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; }
        body { max-width: 34rem; margin: 3rem auto; padding: 0 1rem; color: #172033; }
        h1 { margin-bottom: .5rem; }
        p { line-height: 1.5; }
        form { display: grid; gap: .75rem; margin-top: 1.5rem; }
        label { font-weight: 600; }
        input, button { box-sizing: border-box; width: 100%; padding: .7rem; font: inherit; }
        button { border: 0; border-radius: .4rem; background: #155eef; color: white; cursor: pointer; }
        button:focus-visible, input:focus-visible { outline: 3px solid #84adff; outline-offset: 2px; }
        #resultado { margin-top: 1rem; padding: .75rem 0; }
    </style>
</head>
<body>
    <main>
        <h1>Calculadora de IMC</h1>
        <p>Informe seu peso em quilogramas e sua altura em metros.</p>
        <form id="formulario-imc" novalidate>
            <label for="peso">Peso (kg)</label>
            <input type="text" name="peso" id="peso" inputmode="decimal" autocomplete="off" placeholder="Ex.: 65" aria-describedby="resultado" required>
            <label for="altura">Altura (m)</label>
            <input type="text" name="altura" id="altura" inputmode="decimal" autocomplete="off" placeholder="Ex.: 1,70" aria-describedby="resultado" required>
            <button type="submit">Calcular IMC</button>
        </form>
        <div id="resultado" role="status" aria-live="polite"></div>
        <p><small>As faixas são uma referência geral para adultos. O IMC não é diagnóstico e não substitui avaliação de um profissional de saúde.</small></p>
    </main>
    <script src="script.js"></script>
</body>
</html>
